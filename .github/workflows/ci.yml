name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck
      - run: npm test
      # Dependency vulnerability scan — fail the build on anything high/critical
      # so a vulnerable transitive dep can't quietly land on main.
      - name: npm audit (high and above)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: false

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aqarmudar
          POSTGRES_PASSWORD: aqarmudar
          POSTGRES_DB: aqarmudar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aqarmudar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aqarmudar:aqarmudar@localhost:5432/aqarmudar_test
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-test-secret-that-is-at-least-16-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma db push
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start server
        run: |
          npm start &
          npx wait-on http://localhost:3000/api/health --timeout 60000
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aqar-mudar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
